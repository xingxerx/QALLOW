[package]
name = "qallow-veyn-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.30", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lmdb-rkv = "0.14"
futures-util = { version = "0.3", optional = true }
url = { version = "2.4", optional = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
ws = ["tokio-tungstenite", "futures-util", "url"]

[[bin]]
name = "qallow-veyn-bridge"
path = "src/main.rs"
required-features = ["ws"]
