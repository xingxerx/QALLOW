[package]
name = "qallow-native"
version = "1.0.0"
edition = "2021"
authors = ["Qallow Team"]
description = "Native desktop application for Qallow Quantum-Photonic AGI System"
license = "MIT"

[dependencies]
fltk = { version = "1.4", features = ["fltk-bundled"] }
fltk-theme = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
regex = "1"
lazy_static = "1.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
async-trait = "0.1"
ctrlc = "3.4"
quantum_optimizer = { path = "../quantum_optimizer", optional = true }
cust = { version = "0.3", optional = true }
ndarray = "0.15"
num-complex = "0.4"
csv = "1.3"
notify = "8.2"

# FFI and IPC dependencies
libc = "0.2"
memmap2 = "0.9"
nix = { version = "0.27", features = ["mqueue"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "qallow-native"
path = "src/main.rs"

[features]
default = []
# Enable native_app's quantum features by pulling in the optional crate
quantum = ["quantum_optimizer"]
# Enable GPU acceleration via CUDA
gpu = ["cust"]
